name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server and web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build the web bundle
        run: npm run build
      - name: Parse the Android sources
        run: npm run check:java

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The APK ships the web UI, which Vite builds into dist/web.
      - run: npm ci
      - name: Build the web bundle
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assemble the debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace -PpatchPilotVersion=0.0.0-ci

      - uses: actions/upload-artifact@v4
        with:
          name: patchpilot-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
